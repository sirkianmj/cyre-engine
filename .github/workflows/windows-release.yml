name: Windows Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Windows Tauri configuration
        run: Copy-Item -Force studio/desktop/src-tauri/tauri.windows.conf.json studio/desktop/src-tauri/tauri.conf.json

      - name: Build CYRE Studio Windows app
        run: pnpm --filter @cyre/studio package:desktop

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyre-windows
          path: studio/desktop/src-tauri/target/release/bundle/
